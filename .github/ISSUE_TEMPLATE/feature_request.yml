name: Feature request
description: Suggest something the library should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The job you want done, rather than the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could the library help?
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
