name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generated files are current
        run: npm run generate:check
      - name: Typecheck, lint, format, test, build, package and size
        run: npm run check
      - name: No secrets committed
        run: npm run secrets
      - name: No known vulnerabilities in what ships
        run: npm audit --omit=dev --audit-level=low
      - name: No high vulnerabilities in tooling
        run: npm audit --audit-level=high
      - name: Only the intended files are published
        run: npm pack --dry-run

  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  runtimes:
    name: Built package on Node, Bun and Deno
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/smoke.mjs
      - run: node scripts/smoke.cjs
      - run: node dist/cli.js --help
      - uses: oven-sh/setup-bun@v2
      - run: bun scripts/smoke.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno run --allow-read --allow-env scripts/smoke.mjs
