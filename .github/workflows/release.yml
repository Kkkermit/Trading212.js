name: Release

# On every push to main: open or update the release pull request while changesets are waiting, or publish the
# version in package.json once that pull request has been merged. Run it by hand from the Actions tab to retry a
# publish that failed, without a new commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: release

permissions:
  contents: read

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # npm trusted publishing (OIDC) with provenance, so no npm token is stored.
      id-token: write
      # The GitHub Packages copy is published with the workflow's own token.
      packages: write
    steps:
      # Changesets pushes the version branch, and this job pushes the tag, so the checkout keeps its credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@11
      - run: npm ci

      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        id: changesets
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: npx changeset version
          commit-message: "chore: Release a new version"
          pr-title: "chore: Release a new version"

      # npm publish is run directly rather than through Changesets, so npm's own reason for any refusal shows here.
      - name: Publish to npm
        id: npm
        if: steps.changesets.outputs.has-changesets == 'false'
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "$name@$version is already on npm."
            echo "on-npm=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Publishing $name@$version with npm $(npm --version)."
          npm run check
          # npm explains a refused trusted publisher only at this level, on a line starting "npm verbose oidc".
          if ! npm publish --loglevel verbose; then
            echo "::error::npm refused $name@$version. The 'npm verbose oidc' line above says why trusted publishing failed."
            exit 1
          fi
          echo "on-npm=true" >> "$GITHUB_OUTPUT"

      - name: Tag and write the GitHub release
        if: steps.npm.outputs.on-npm == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is already tagged."
            exit 0
          fi
          git tag "v$version"
          git push origin "v$version"
          awk -v heading="## $version" '$0 == heading { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md > notes.md
          gh release create "v$version" --title "v$version" --notes-file notes.md --verify-tag

      # GitHub Packages gets a copy of each version on npm, so the package shows on the repository page. It goes by the
      # publish step's answer, because npm can take a minute to show a version it has just accepted.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.npm.outputs.on-npm == 'true'
        with:
          registry-url: https://npm.pkg.github.com
      - name: Mirror the release to GitHub Packages
        if: steps.npm.outputs.on-npm == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "$name@$version is already on GitHub Packages."
            exit 0
          fi
          npm publish --provenance=false
